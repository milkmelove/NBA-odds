name: volleyball-test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  vb:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install oddsharvester
          playwright install --with-deps chromium
      - name: Scrape volleyball (today + tomorrow)
        continue-on-error: true
        run: |
          mkdir -p out
          for d in $(date -u +%Y%m%d) $(date -u -d "+1 day" +%Y%m%d); do
            oddsharvester upcoming -s volleyball -d $d -m home_away --headless -f json -o out/vb_${d}_home_away.json > out/log_${d}_home_away.txt 2>&1 || true
            oddsharvester upcoming -s volleyball -d $d -m total_points_over_under --headless -f json -o out/vb_${d}_totals.json > out/log_${d}_totals.txt 2>&1 || true
          done
          ls -la out
      - name: Publish results to volleyball-test branch
        run: |
          cd out
          git init -q -b volleyball-test
          git config user.email "bot@users.noreply.github.com"
          git config user.name "bot"
          git add -A
          git commit -q -m "volleyball test"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" volleyball-test
