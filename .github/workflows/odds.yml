name: odds-snapshot
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape
        run: python3 scrape.py
      - name: Publish to data branch (single commit, no history growth)
        run: |
          cd out
          git init -q -b data
          git config user.name "odds-bot"; git config user.email "odds-bot@users.noreply.github.com"
          git add -A; git commit -q -m "snapshot $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
